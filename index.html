<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scatoloni">
<meta name="theme-color" content="#2a2233">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Scatoloni</title>
<style>
:root{--ink:#3b2a26;--paper:#fff8ef;--accent:#ef7d6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2233;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;
  overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%}
#wrap{position:absolute;inset:0}
#holder{position:absolute;inset:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff8ef;color:var(--ink);font-weight:800}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#fff;padding:11px 26px;font-size:17px;box-shadow:0 3px 0 var(--ink)}
/* HUD sopra il gioco */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;z-index:4;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#hud>*{pointer-events:auto}
#hud .sp{flex:1;pointer-events:none}
.pill{background:rgba(42,30,48,.72);color:#fff8ef;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.15)}
#timer,#errs{display:none}
#timer.low{background:#c8414a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
#hud button{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center}
#zoomUI{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;z-index:3}
#zoomUI button{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 0 var(--ink)}
#toast{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 50px));transform:translateX(-50%);background:var(--paper);padding:8px 16px;border-radius:14px;font-weight:800;
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:opacity .4s;opacity:0;pointer-events:none;white-space:nowrap;font-size:15px;z-index:4}
.overlay{position:absolute;inset:0;background:rgba(42,30,48,.6);display:flex;align-items:center;justify-content:center;z-index:6}
.card{background:var(--paper);border-radius:22px;border:3px solid var(--ink);padding:24px 30px;max-width:min(560px,92%);max-height:90%;overflow:auto;text-align:center;box-shadow:0 6px 0 var(--ink)}
.card .year{font-size:42px;font-weight:900;color:var(--accent);line-height:1;-webkit-text-stroke:1px var(--ink)}
.card h2{margin:6px 0 10px;font-size:26px}
.card p{font-size:17px;line-height:1.5;margin:0 0 14px}
.card .how{font-size:14px;opacity:.75}
.card .big{font-size:54px;margin-bottom:4px}
.rooms{display:grid;gap:6px;text-align:left;margin:10px 0 16px}
.rooms .h{font-weight:900;margin-top:8px;font-size:14px;color:var(--accent)}
.rooms button{background:#f6e9da;text-align:left;font-weight:700;box-shadow:none}
.rooms button[disabled]{opacity:.4;cursor:default}
.set{text-align:left;display:grid;gap:14px;margin:6px 0 16px}
.set .row{display:grid;gap:6px}
.set .lab{font-weight:900;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#f6e9da;font-weight:700;padding:6px 11px}
.seg button.on{background:var(--accent);color:#fff}
.set input[type=range]{width:100%;accent-color:var(--accent)}
.set .note{font-size:13px;opacity:.75}
#rotate{display:none;position:fixed;inset:0;background:#2a2233;color:#fff8ef;z-index:50;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;font-size:18px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rotate.on{display:flex}}
@media (max-width:560px),(max-height:420px){#hud button{width:36px;height:36px;font-size:16px}.pill{font-size:13px;padding:5px 10px}}
</style>
</head>

<div id="rotate" class="on"><div class="ph">📱</div><p>Gira il telefono in orizzontale<br>per giocare meglio.</p><button onclick="this.parentNode.classList.remove('on')">Gioca in verticale</button></div>

// ---------- utilità di gioco ----------
function blockers(){return R.boxes.filter(b=>b.z<1.9).concat(cartons.filter(c=>!c.vanish))}
function okSpot(x,y,ignore){
  if(x<.35||y<.35||x>N-.35||y>N-.35)return false;
  for(const b of blockers())if(x>b.x-.3&&x<b.x+b.w+.3&&y>b.y-.3&&y<b.y+b.d+.3)return false;
  for(const it of items)if(it!==ignore&&it.state==="loose"&&Math.hypot(it.x-x,it.y-y)<.62)return false;
  for(const s of R.slots)if(s.floor&&Math.hypot(s.x-x,s.y-y)<.5)return false;
  return true;
}
function freeSpot(px,py,ignore){
  for(let rad=0;rad<7;rad+=.3){const st=rad?Math.ceil(rad*9):1;for(let k=0;k<st;k++){const a=Math.PI/4+k/st*Math.PI*2;const x=px+Math.cos(a)*rad,y=py+Math.sin(a)*rad;if(okSpot(x,y,ignore))return[x,y]}}
  return[clamp(px,.4,N-.4),clamp(py,.4,N-.4)];
}
function itemPos(it){
  if(it.slot){it.x=it.slot.x;it.y=it.slot.y;it.z=it.slot.z}
  if(!it.anim)return{x:it.x,y:it.y,z:it.z};
  const a=it.anim,p=clamp((now-a.t0)/a.dur,0,1),e=1-Math.pow(1-p,2);
  if(p>=1){it.anim=null;return{x:it.x,y:it.y,z:it.z}}
  return{x:a.fx+(it.x-a.fx)*e,y:a.fy+(it.y-a.fy)*e,z:a.fz+(it.z-a.fz)*e+Math.sin(Math.PI*p)*1.8};
}
function openCarton(c){

  if(c.open==null){c.open=now;c.busy=true;SFX.box();const t=P(c.x+c.w/2,c.y+c.d/2,c.h);puff(t[0],t[1]-6,10);
    setTimeout(()=>{c.busy=false;emerge(c)},300);dirty=true;return}
  emerge(c);
}
function emerge(c){
  if(!c.queue.length||finished)return;
  const it=c.queue.shift();
  const[sx,sy]=freeSpot(c.x+c.w+.5,c.y+c.d+.5,it);
  it.state="loose";it.x=sx;it.y=sy;it.z=0;it.plane="top";
  it.anim={t0:now,dur:520,fx:c.x+c.w/2,fy:c.y+c.d/2,fz:c.h-.3};it.popT=now+380;
  c.bump=now;SFX.pop();
  const t=P(c.x+c.w/2,c.y+c.d/2,c.h);sparkle(t[0],t[1]-10,5);
  if(!c.queue.length){c.vanish=now+600;setTimeout(()=>{const q=P(c.x+c.w/2,c.y+c.d/2,.4);puff(q[0],q[1],14);SFX.poof()},600)}
  updateCount();dirty=true;
}
function updateCount(){
  const placed=items.filter(i=>i.state==="slot").length;
  const inBox=cartons.reduce((a,c)=>a+c.queue.length,0);
  document.getElementById("count").textContent=(inBox?`📦 ${inBox} · `:"")+`✅ ${placed}/${items.length}`;
}
function check(){
  updateCount();
  if(finished)return;
  if(items.some(i=>i.state!=="slot"))return;
  const wrong=items.filter(i=>!allowed(i,i.slot));
  items.forEach(i=>i.bad=wrong.includes(i));
  if(!wrong.length){finished=true;const c=P(N/2,N/2,1);for(let k=0;k<4;k++)setTimeout(()=>sparkle(c[0]+(Math.random()-.5)*300,c[1]-Math.random()*200,8),k*150);setTimeout(win,900)}
  else{showToast(wrong.length===1?"Un oggetto è in un posto strano":`${wrong.length} oggetti sono in posti strani`);SFX.wrong()}
  dirty=true;
}

function drawFX(){
  for(let i=FX.length-1;i>=0;i--){const f=FX[i],p=(now-f.t0)/f.life;if(p<0)continue;if(p>=1){FX.splice(i,1);continue}
    const s=(now-f.t0)/1000,x=f.x+f.vx*s,y=f.y+f.vy*s+(f.t==="star"?40*s*s:-10*s);

    ctx.restore()}
}

  if(t-lastStat>200){updateStatus();lastStat=t}
  if(dirty||animating()){draw();dirty=false}
  requestAnimationFrame(frame);
}

Object.assign(SFX,{
  pop(){if(!this.ok())return;const t=A.ctx.currentTime;tone(520,t,{type:"sine",d:.12,v:.08,f2:900});noise(t,{d:.08,v:.05,type:"lowpass",f:1200})},
  poof(){if(!this.ok())return;const t=A.ctx.currentTime;noise(t,{d:.3,v:.09,type:"lowpass",f:900,a:.03});tone(300,t,{d:.2,v:.05,f2:150})},
  door(open){if(!this.ok())return;const t=A.ctx.currentTime;
    if(open){noise(t,{d:.35,v:.06,type:"bandpass",f:600,q:3,a:.05});tone(260,t,{type:"triangle",d:.3,v:.035,f2:360,lp:900})}
    else{tone(140,t+.12,{d:.15,v:.14,f2:90});noise(t+.12,{d:.06,v:.08,type:"lowpass",f:700})}},
  drawer(open){if(!this.ok())return;const t=A.ctx.currentTime;noise(t,{d:.3,v:.08,type:"bandpass",f:open?750:550,q:.8,a:.06});tone(900,t+.3,{d:.04,v:.035})},
  cloth(){if(!this.ok())return;const t=A.ctx.currentTime;noise(t,{d:.4,v:.09,type:"highpass",f:2200,q:.5,a:.1});noise(t+.12,{d:.3,v:.05,type:"bandpass",f:4000,q:.6,a:.08})}
});

// ================= Vista: zoom e spostamento =================
let VW=960,VH=640,baseZ=1,cam={x:480,y:300,z:1},home={x:480,y:300},bounds=[0,0,960,640];
function Z(){return baseZ*cam.z}
function ps(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function toWorld(s){const z=Z();return{x:(s.x-VW/2)/z+cam.x,y:(s.y-VH/2)/z+cam.y}}
function computeBase(){
  const x0=ox-(N+.35)*U,x1=ox+(N+.35)*U,y0=P(-.3,-.3,WH)[1]-12,y1=P(N,N,-.5)[1]+10;
  bounds=[x0,y0,x1,y1];home={x:(x0+x1)/2,y:(y0+y1)/2-12};
  const topPad=Math.min(48,VH*.08);baseZ=Math.min(VW/(x1-x0),(VH-topPad)/(y1-y0));home.y-=topPad/2/baseZ;
}
function clampCam(){
  cam.z=clamp(cam.z,1,4);if(cam.z<=1.001){cam.z=1;cam.x=home.x;cam.y=home.y;return}
  const z=Z(),hw=VW/2/z,hh=VH/2/z,[x0,y0,x1,y1]=bounds;
  cam.x=(x1-x0)>2*hw?clamp(cam.x,x0+hw,x1-hw):home.x;cam.y=(y1-y0)>2*hh?clamp(cam.y,y0+hh-40/z,y1-hh):home.y;
}
function zoomAt(s,nz){const w=toWorld(s);cam.z=clamp(nz,1,4);const z=Z();cam.x=w.x-(s.x-VW/2)/z;cam.y=w.y-(s.y-VH/2)/z;clampCam();dirty=true}

// ---------- input ----------
function inRect(p,r){return r&&p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3]}
function inBB(p,b){return b&&p.x>=b[0]&&p.x<=b[2]&&p.y>=b[1]&&p.y<=b[3]}
function pip(p,q){let c=false;for(let i=0,j=q.length-1;i<q.length;j=i++){const a=q[i],b=q[j];if((a[1]>p.y)!==(b[1]>p.y)&&p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function unionBB(list){let b=null;for(const o of list){const q=o.bb;if(!q)continue;b=b?[Math.min(b[0],q[0]),Math.min(b[1],q[1]),Math.max(b[2],q[2]),Math.max(b[3],q[3])]:q.slice()}return b}
function opBB(op){if(op.type==="door")return unionBB(op.boxes.concat(lastOrder.filter(o=>o.kind==="door"&&o.op===op)));
  if(op.type==="drawer")return unionBB([op.body,...(op.lastParts||[])]);return op.box.bb}
function pickItem(p){for(let k=lastOrder.length-1;k>=0;k--){const o=lastOrder[k];if(o.kind==="item"&&inRect(p,o.it.rect))return o.it}return null}
function pickCarton(p){for(let k=lastOrder.length-1;k>=0;k--){const o=lastOrder[k];if(o.kind==="carton"&&o.bb&&inBB(p,o.bb))return o}return null}
function pickOpen(p){
  for(const op of R.opens){
    if(op.type==="door"){if(op.p>.3){if((op.quads||[]).some(q=>pip(p,q)))return op}else if(inBB(p,opBB(op)))return op}
    else if(inBB(p,opBB(op)))return op;
  }return null}
function toggleOpen(op){
  op.target=op.target?0:1;dirty=true;
  if(op.type==="door")SFX.door(!!op.target);else if(op.type==="drawer")SFX.drawer(!!op.target);else SFX.cloth();
}
function slotCenter(s){const p=P(s.x,s.y,s.z);return s.plane==="top"?[p[0],p[1]-s.cap/2]:p}
function findTarget(it,bx,by){
  let best=null,bd=48;const cx=bx,cy=by-it.s*.55;
  for(const s of R.slots){if((s.item&&s.item!==it)||!slotOn(s)||!fits(it,s))continue;const c=slotCenter(s);const d=Math.hypot(c[0]-cx,c[1]-cy);if(d<bd){bd=d;best=s}}
  return best;
}
const ptrs=new Map();let pinch=null,pan=null,lastTap={t:0,x:0,y:0};
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();const s=ps(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2&&!drag){pan=null;const[a,b]=[...ptrs.values()];const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,w:toWorld(mid)};return}
  if(ptrs.size>1)return;
  const p=toWorld(s);
  if(!finished){
    const it=pickItem(p);
    if(it){timerOn=true;cv.setPointerCapture(e.pointerId);
      const r=it.rect,bx=r[0]+r[2]/2,by=it.plane==="top"?r[1]+r[3]-it.s*.04:r[1]+r[3]*.5+it.s*.5;
      drag={it,dx:bx-p.x,dy:by-p.y,bx,by,prev:{state:it.state,slot:it.slot,x:it.x,y:it.y,z:it.z,plane:it.plane},target:null};
      if(it.slot){it.slot.item=null;it.slot=null}it.state="drag";it.anim=null;it.bad=false;SFX.pick();dirty=true;return}
    const c=pickCarton(p);if(c){timerOn=true;if(hint&&hint.carton===c)hint=null;openCarton(c);return}
    const op=pickOpen(p);if(op){if(hint&&hint.op===op)hint=null;toggleOpen(op);return}
  }
  if(now-lastTap.t<320&&Math.hypot(s.x-lastTap.x,s.y-lastTap.y)<30){zoomAt(s,cam.z>1.3?1:2.2);lastTap.t=0;return}
  lastTap={t:now,x:s.x,y:s.y};
  cv.setPointerCapture(e.pointerId);pan={sx:s.x,sy:s.y,cx:cam.x,cy:cam.y};
});
cv.addEventListener("pointermove",e=>{
  const s=ps(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    cam.z=clamp(pinch.z*d/pinch.d,1,4);const z=Z();cam.x=pinch.w.x-(mid.x-VW/2)/z;cam.y=pinch.w.y-(mid.y-VH/2)/z;clampCam();dirty=true;return}
  const p=toWorld(s);
  if(drag){drag.bx=p.x+drag.dx;drag.by=p.y+drag.dy;const t=findTarget(drag.it,drag.bx,drag.by);if(t!==drag.target&&t)SFX.ui();drag.target=t;dirty=true;return}
  if(pan){const z=Z();cam.x=pan.cx-(s.x-pan.sx)/z;cam.y=pan.cy-(s.y-pan.sy)/z;clampCam();dirty=true;return}
  if(e.pointerType==="mouse"&&R){const h=pickItem(p);const c=h?null:(pickCarton(p)||pickOpen(p));if(h!==hover){hover=h;dirty=true}cv.style.cursor=h?"grab":c?"pointer":(cam.z>1?"move":"default")}
});
function ptrUp(e){
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;pan=null;return}
  if(drag)endDrag();pan=null;
}
cv.addEventListener("pointerup",ptrUp);cv.addEventListener("pointercancel",ptrUp);
cv.addEventListener("pointerleave",()=>{if(hover){hover=null;dirty=true}});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(ps(e),cam.z*Math.exp(-e.deltaY*.0015))},{passive:false});
document.getElementById("zIn").onclick=()=>zoomAt({x:VW/2,y:VH/2},cam.z*1.4);
document.getElementById("zOut").onclick=()=>zoomAt({x:VW/2,y:VH/2},cam.z/1.4);
document.getElementById("zFit").onclick=()=>{cam.z=1;clampCam();dirty=true};

function endDrag(){
  if(!drag)return;const it=drag.it,t=drag.target;
  if(t&&RULE.errs&&!allowed(it,t)){
    errors++;it.flash=now;SFX.wrong();
    const[sx,sy]=freeSpot(clamp(t.x,.6,N-.6)+.7,clamp(t.y,.6,N-.6)+.7,it);
    Object.assign(it,{state:"loose",slot:null,x:sx,y:sy,z:0,plane:"top",bad:false});
    it.anim={t0:now,dur:380,fx:t.plane==="L"?.3:t.x,fy:t.plane==="R"?.3:t.y,fz:t.z};
    showToast(`Lì non ha senso! Errori: ${errors}/${RULE.errs}`);
    drag=null;dirty=true;updateStatus();updateCount();
    if(errors>=RULE.errs)setTimeout(()=>lose("errs"),450);
    return;
  }
  if(t){it.state="slot";it.slot=t;t.item=it;it.x=t.x;it.y=t.y;it.z=t.z;it.plane=t.plane;it.popT=now;SFX.place();
    const q=P(t.x,t.y,t.z);sparkle(q[0],q[1]-it.s*.6,4)}
  else{const[fx,fy]=inv(drag.bx,drag.by);
    if(fx>-.2&&fy>-.2&&fx<N+.2&&fy<N+.2){const[sx,sy]=freeSpot(fx,fy,it);it.state="loose";it.x=sx;it.y=sy;it.z=0;it.plane="top";SFX.drop()}
    else{const pv=drag.prev;Object.assign(it,{state:pv.state,x:pv.x,y:pv.y,z:pv.z,plane:pv.plane});if(pv.slot&&!pv.slot.item){it.slot=pv.slot;pv.slot.item=it}else if(pv.slot){const[sx,sy]=freeSpot(N/2,N/2,it);Object.assign(it,{state:"loose",slot:null,x:sx,y:sy,z:0,plane:"top"})}}}
  if(hint&&hint.it===it)hint=null;
  drag=null;dirty=true;check();
}

// ---------- interfaccia ----------
let toastT;
function showToast(t){const el=document.getElementById("toast");el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2400)}
function overlay(html,buttons){
  const o=document.createElement("div");o.className="overlay";const c=document.createElement("div");c.className="card";c.innerHTML=html;o.appendChild(c);
  for(const[label,cls,fn]of buttons){const b=document.createElement("button");b.className=cls;b.textContent=label;b.style.margin="4px";b.onclick=()=>{o.remove();SFX.ui();fn()};c.appendChild(b)}
  holder.appendChild(o);return o;
}
function fmtTime(s){s=Math.ceil(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function updateStatus(){
  const te=document.getElementById("timer"),ee=document.getElementById("errs");
  te.style.display=RULE.time?"inline-block":"none";ee.style.display=RULE.errs?"inline-block":"none";
  if(RULE.time){te.textContent="⏱ "+fmtTime(timeLeft);te.classList.toggle("low",timeLeft<=20&&!finished)}
  if(RULE.errs)ee.textContent=`❌ ${errors}/${RULE.errs}`;
}
function lose(kind){
  if(finished)return;finished=true;drag=null;hint=null;SFX.lose();updateStatus();
  overlay(`<div class="big">${kind==="time"?"⏰":"💥"}</div><h2>${kind==="time"?"Tempo scaduto":"Troppi errori"}</h2><p>${kind==="time"?"La stanza non è finita in tempo.":"Hai raggiunto il numero massimo di errori."} Riprova!</p>`,
    [["Riprova la stanza","primary",()=>loadRoom(ri,false)],["Impostazioni","",()=>settingsMenu(()=>loadRoom(ri,false))]]);
}
function win(){
  SFX.win();
  const extra=(RULE.time?`Tempo rimasto: ${fmtTime(timeLeft)}`:"")+(RULE.time&&RULE.errs?" · ":"")+(RULE.errs?`Errori: ${errors}/${RULE.errs}`:"");
  if(ri<ROOMS.length-1){
    overlay(`<div class="big">✨</div><h2>${room.name}: tutto a posto!</h2><p>Ogni oggetto ha trovato il suo posto.</p>${extra?`<p class="how">${extra}</p>`:""}`,[["Prossima stanza","primary",()=>loadRoom(ri+1)]]);
  }else{
    overlay(`<div class="big">🧸</div><h2>Fine</h2><p>Cinque case, undici stanze, tanti scatoloni.<br>Il vecchio orsetto adesso ha un nuovo padrone.</p>`,[["Rigioca dall'inizio","primary",()=>loadRoom(0)]]);
  }
}
function roomsMenu(){
  const mx=parseInt(store("scatoloni3-max")||"0",10)||0;
  const o=overlay(`<h2>Stanze</h2><div class="rooms"></div>`,[["Chiudi","",()=>{}]]);
  const box=o.querySelector(".rooms");let h=-1;
  ROOMS.forEach((r,i)=>{if(r.h!==h){h=r.h;const d=document.createElement("div");d.className="h";d.textContent=`${HOUSES[h].year} · ${HOUSES[h].name}`;box.appendChild(d)}
    const b=document.createElement("button");b.textContent=(i<=mx?"":"🔒 ")+r.name+(i===ri?"  ← qui":"");b.disabled=i>mx;b.onclick=()=>{o.remove();loadRoom(i)};box.appendChild(b)});
}
function settingsMenu(after){
  const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("")}</div>`;
  const o=overlay(`<h2>Impostazioni</h2><div class="set">
    <div class="row"><div class="lab">🎵 Musica di sottofondo</div>${seg("music",[[1,"Accesa"],[0,"Spenta"]])}
      <label class="note">Volume musica <input type="range" min="0" max="1" step="0.05" id="volR"></label></div>
    <div class="row"><div class="lab">🔔 Effetti sonori</div>${seg("sfx",[[1,"Accesi"],[0,"Spenti"]])}</div>
    <div class="row"><div class="lab">⏱ Tempo per ogni stanza</div>${seg("time",[[0,"Nessun limite"],[1,"1 min"],[2,"2 min"],[3,"3 min"],[5,"5 min"],[10,"10 min"]])}</div>
    <div class="row"><div class="lab">❌ Errori massimi per stanza</div>${seg("errs",[[0,"Nessun limite"],[1,"1"],[3,"3"],[5,"5"],[10,"10"]])}
      <div class="note">Con un limite di errori, un oggetto messo in un posto senza senso viene respinto subito e conta come errore.</div></div>
    <div class="note">Tempo ed errori valgono dalla prossima stanza, oppure subito se ricominci la stanza con ↺.</div>
  </div>`,[["Fatto","primary",()=>{after&&after()}]]);
  const refresh=()=>o.querySelectorAll(".seg").forEach(sg=>{const k=sg.dataset.k;sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(+SET[k])===b.dataset.v))});
  o.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.parentNode.dataset.k;SET[k]=(k==="music"||k==="sfx")?b.dataset.v==="1":+b.dataset.v;saveSet();refresh();
    if(k==="music"){initAudio();SET.music?musicOn():musicOff();updMusicBtn()}
    if(k==="sfx"&&A.ctx)A.sfx.gain.value=SET.sfx?.8:0;
    SFX.ui();
  });
  const vr=o.querySelector("#volR");vr.value=SET.vol;vr.oninput=()=>{SET.vol=+vr.value;saveSet();if(A.ctx&&mus.on)A.mus.gain.setTargetAtTime(SET.vol,A.ctx.currentTime,.1)};
  refresh();
}
function doHint(){
  if(finished)return;
  const it=items.find(i=>i.bad)||items.find(i=>i.state==="loose")||items.find(i=>i.state==="slot"&&!allowed(i,i.slot));
  if(!it){const c=cartons.find(c=>c.queue.length&&!c.vanish);if(c){hint={carton:c,t0:now};showToast("Apri uno scatolone")}else showToast("Sembra tutto a posto!");dirty=true;return}
  const free=R.slots.filter(s=>!s.item&&allowed(it,s));
  const open=free.find(s=>slotOn(s));
  if(open){hint={it,slot:open,t0:now};showToast(`${it.n}: ecco un posto adatto`)}
  else if(free.length){const op=free[0].owner;hint={it,op,t0:now};showToast(`${it.n}: prova ad aprire ${op.label}`)}
  else{const occ=R.slots.find(s=>s.item&&allowed(it,s));hint={it,slot:null,t0:now};showToast(occ?`${it.n}: libera prima un posto occupato`:"Prova a spostare qualcosa")}
  dirty=true;
}

const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;

  const de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;

    try{const p=req.call(de,{navigationUI:"hide"});if(p&&p.then)p.then(()=>{try{screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}).catch(()=>iosFsHelp())}catch(e){iosFsHelp()}
