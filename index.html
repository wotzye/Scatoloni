<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scatoloni">
<meta name="theme-color" content="#1c1820">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<title>Scatoloni</title>
<style>
:root{--ink:#3b2f2a;--paper:#fff8ef;--accent:#e07a5f}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;background:#241f28;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded",Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
html,body{position:fixed;inset:0;width:100%}
#bar{display:flex;align-items:center;gap:10px;padding:8px 14px;background:#1c1820;color:#f4e9dc;flex:0 0 auto;flex-wrap:wrap}
#bar h1{font-size:18px;margin:0 6px 0 0;font-weight:800}
#lvl{font-size:14px;opacity:.85}
#count{margin-left:auto;font-weight:700;font-size:14px;opacity:.9}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:6px 12px;background:#f4e9dc;color:var(--ink);font-weight:700}
button:hover{filter:brightness(1.06)}
button.primary{background:var(--accent);color:#fff;padding:11px 26px;font-size:17px}
#wrap{flex:1;min-height:0;position:relative}
#holder{position:absolute;inset:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--paper);padding:8px 16px;border-radius:12px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .4s;opacity:0;pointer-events:none;white-space:nowrap;font-size:15px}
.overlay{position:absolute;inset:0;background:rgba(28,24,32,.72);display:flex;align-items:center;justify-content:center;z-index:5}
#zoomUI{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px;z-index:3}
#zoomUI button{width:42px;height:42px;border-radius:12px;padding:0;font-size:20px;background:rgba(244,233,220,.88);box-shadow:0 2px 8px rgba(0,0,0,.3)}
#timer,#errs{display:none;padding:2px 8px;border-radius:8px;background:#3a3340;font-weight:700;font-size:14px;white-space:nowrap}
#timer.low{background:#b23b3b;color:#fff;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
.set{text-align:left;display:grid;gap:14px;margin:6px 0 16px}
.set .row{display:grid;gap:6px}
.set .lab{font-weight:800;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#efe3d3;font-weight:600;padding:7px 12px}
.seg button.on{background:var(--accent);color:#fff}
.set input[type=range]{width:100%;accent-color:var(--accent)}
.set .note{font-size:13px;opacity:.75}
.card{background:var(--paper);border-radius:18px;padding:26px 32px;max-width:min(560px,92%);max-height:92%;overflow:auto;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.card .year{font-size:42px;font-weight:800;color:var(--accent);line-height:1}
.card h2{margin:6px 0 10px;font-size:26px}
.card p{font-size:17px;line-height:1.5;margin:0 0 16px}
.card .how{font-size:14px;opacity:.7}
.card .big{font-size:56px;margin-bottom:4px}
.rooms{display:grid;gap:6px;text-align:left;margin:10px 0 16px}
.rooms .h{font-weight:800;margin-top:8px;font-size:14px;color:var(--accent)}
.rooms button{background:#efe3d3;text-align:left;font-weight:600}
.rooms button[disabled]{opacity:.4;cursor:default}
@media (max-height:500px),(max-width:600px){#bar{padding:4px 10px;gap:6px}#bar h1{font-size:15px}#lvl{font-size:12px}#count{font-size:12px}#bar button{padding:4px 9px;font-size:13px}}
@media (max-width:700px),(max-height:500px){#lvl{display:none}.lbl{display:none}#bar h1{font-size:14px}}
#bar{flex-wrap:nowrap}#count{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#rotate{display:none;position:fixed;inset:0;background:#1c1820;color:#f4e9dc;z-index:50;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;font-size:18px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rotate.on{display:flex}}
</style>
</head>
<body>
<div id="rotate" class="on"><div class="ph">📱</div><p>Gira il telefono in orizzontale<br>per giocare meglio.</p><button onclick="this.parentNode.classList.remove('on')">Gioca in verticale</button></div>

    <button id="musicB" title="Musica">🎵</button>
    <button id="setB" title="Impostazioni">⚙️</button>
    <button id="restartB" title="Ricomincia la stanza">↺</button>
  </div>
  <div id="wrap"><div id="holder"><canvas id="cv"></canvas><div id="toast"></div><div id="zoomUI"><button id="zIn" title="Ingrandisci">＋</button><button id="zOut" title="Riduci">－</button><button id="zFit" title="Vista intera">⤢</button></div></div></div>
</div>

  r.crib=(x,y,w,d)=>{const c="#ffffff";r.box(x,y,0,.15,d,1.9,c);r.box(x+w-.15,y,0,.15,d,1.9,c);r.box(x+.15,y,0,w-.3,d,.75,"#f3efe8");
    r.box(x+.15,y,1.0,w-.3,.08,.8,c);const m=r.box(x+.2,y+.1,.75,w-.4,d-.2,.25,"#cfe6f5");

// ---------- caricamento ----------
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function loadRoom(i,intro=true){
  ri=i;room=ROOMS[i];N=room.N;finished=false;drag=null;hover=null;hint=null;
  oy=300;computeBase();cam={x:home.x,y:home.y,z:1};
  RULE={time:SET.time,errs:SET.errs};errors=0;timeLeft=RULE.time*60;timerOn=false;placeStep=0;
  store("scatoloni3-cur",String(i));
  const mx=parseInt(store("scatoloni3-max")||"0",10)||0;if(i>mx)store("scatoloni3-max",String(i));
  R=builder();room.build(R);
  items=shuffle(room.items.map(d=>({e:d[0],n:d[1],tag:d[2],s:d[3],state:"queue",slot:null,x:0,y:0,z:0,plane:"top",bad:false})));
  cartons=room.cartons.map(([x,y])=>({kind:"carton",x,y,z:0,w:1.1,d:1.1,h:.9,c:"#c9935a",queue:[],decos:[
    {t:"rect",u0:.44,v0:0,u1:.56,v1:1,c:"#e9d29c"},{t:"fy",u0:.44,u1:.56,w0:.5,w1:1,c:"#e2c88e"},{t:"rect",u0:0,v0:.49,u1:1,v1:.51,c:"#a8743f"}]}));
  items.forEach((it,k)=>cartons[k%cartons.length].queue.push(it));
  // controllo coerenza tag
  const cnt={};R.slots.forEach(s=>cnt[s.tag]=(cnt[s.tag]||0)+1);items.forEach(it=>cnt[it.tag]=(cnt[it.tag]||0)-1);
  for(const k in cnt)if(cnt[k])console.warn("Tag non bilanciato",room.name,k,cnt[k]);
  const H=HOUSES[room.h];
  document.getElementById("lvl").textContent=`${H.year} · ${H.name} — ${room.name}  (${i+1}/${ROOMS.length})`;
  updateCount();dirty=true;
  if(intro){
    const first=i===0||ROOMS[i-1].h!==room.h;
    if(first)overlay(`<div class="year">${H.year}</div><h2>${H.name}</h2><p>${H.story}</p><p class="how">Tocca uno scatolone per tirare fuori un oggetto, poi trascinalo nel punto esatto in cui deve stare. Le sagome tratteggiate indicano i posti liberi.</p>`,[["Inizia","primary",()=>{}]]);
    else showToast(room.name);
  }
}

// ---------- utilità di gioco ----------
function blockers(){return R.boxes.filter(b=>b.z<1.9).concat(cartons.filter(c=>!c.vanish))}
function okSpot(x,y,ignore){
  if(x<.35||y<.35||x>N-.35||y>N-.35)return false;
  for(const b of blockers())if(x>b.x-.3&&x<b.x+b.w+.3&&y>b.y-.3&&y<b.y+b.d+.3)return false;
  for(const it of items)if(it!==ignore&&it.state==="loose"&&Math.hypot(it.x-x,it.y-y)<.62)return false;
  for(const s of R.slots)if(s.floor&&Math.hypot(s.x-x,s.y-y)<.5)return false;
  return true;
}
function freeSpot(px,py,ignore){
  for(let rad=0;rad<7;rad+=.3){const st=rad?Math.ceil(rad*9):1;for(let k=0;k<st;k++){const a=Math.PI/4+k/st*Math.PI*2;const x=px+Math.cos(a)*rad,y=py+Math.sin(a)*rad;if(okSpot(x,y,ignore))return[x,y]}}
  return[clamp(px,.4,N-.4),clamp(py,.4,N-.4)];
}
function itemPos(it){
  if(!it.anim)return{x:it.x,y:it.y,z:it.z};
  const a=it.anim,p=clamp((now-a.t0)/a.dur,0,1),e=1-Math.pow(1-p,2);
  if(p>=1){it.anim=null;return{x:it.x,y:it.y,z:it.z}}
  return{x:a.fx+(it.x-a.fx)*e,y:a.fy+(it.y-a.fy)*e,z:a.fz+(it.z-a.fz)*e+Math.sin(Math.PI*p)*1.6};
}
function openCarton(c){
  if(!c.queue.length||finished||c.vanish)return;
  const it=c.queue.shift();
  const[sx,sy]=freeSpot(c.x+c.w+.5,c.y+c.d+.5,it);
  it.state="loose";it.x=sx;it.y=sy;it.z=0;it.plane="top";
  it.anim={t0:now,dur:450,fx:c.x+c.w/2,fy:c.y+c.d/2,fz:c.h};
  c.bump=now;SFX.box();
  if(!c.queue.length)c.vanish=now+250;
  updateCount();dirty=true;
}
function updateCount(){
  const placed=items.filter(i=>i.state==="slot").length;
  const inBox=cartons.reduce((a,c)=>a+c.queue.length,0);
  document.getElementById("count").textContent=(inBox?`📦 ${inBox} · `:"")+`✅ ${placed}/${items.length}`;
}
function check(){
  updateCount();
  if(finished)return;
  if(items.some(i=>i.state!=="slot"))return;
  const wrong=items.filter(i=>i.slot.tag!==i.tag);
  items.forEach(i=>i.bad=wrong.includes(i));
  if(!wrong.length){finished=true;setTimeout(win,600)}
  else{showToast(wrong.length===1?"Un oggetto non è al suo posto":`${wrong.length} oggetti non sono al loro posto`);SFX.wrong()}
  dirty=true;
}

// ---------- disegno ----------
function poly(pts,fill,stroke,lw){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw||1;ctx.stroke()}}
function line(a,b,c,w){ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.strokeStyle=c;ctx.lineWidth=w||1;ctx.stroke()}
function wq(side,a,z){return side==="L"?P(0,a,z):P(a,0,z)}
function wquad(side,a0,a1,z0,z1){return[wq(side,a0,z0),wq(side,a1,z0),wq(side,a1,z1),wq(side,a0,z1)]}
function isoEll(cx,cy,cz,r){const c=P(cx,cy,cz);ctx.beginPath();ctx.ellipse(c[0],c[1],r*U*1.414,r*U*.707,0,0,Math.PI*2)}

function drawShell(){
  const fl=room.floor,[wl,wr]=room.wall,T=.3,S=.5;
  // lastra pavimento e spessori
  poly([P(-T,N,0),P(N,N,0),P(N,N,-S),P(-T,N,-S)],shade(fl,-.38));
  poly([P(N,-T,0),P(N,N,0),P(N,N,-S),P(N,-T,-S)],shade(fl,-.5));
  poly([P(-T,N,0),P(0,N,0),P(0,N,WH),P(-T,N,WH)],shade(wl,-.3));
  poly([P(N,-T,0),P(N,0,0),P(N,0,WH),P(N,-T,WH)],shade(wr,-.42));
  poly([P(-T,N,WH),P(0,N,WH),P(0,0,WH),P(N,0,WH),P(N,-T,WH),P(-T,-T,WH)],shade(wl,.25));
  // pareti
  poly(wquad("L",0,N,0,WH),wl);poly(wquad("R",0,N,0,WH),wr);
  if(room.wp==="stripe"){for(let a=0;a<N;a+=1){poly(wquad("L",a,a+.5,0,WH),"rgba(255,255,255,.13)");poly(wquad("R",a,a+.5,0,WH),"rgba(255,255,255,.13)")}}
  if(room.wp==="tile"){const top=2.6;
    for(const s of["L","R"]){for(let z=.5;z<=top;z+=.5)line(wq(s,0,z),wq(s,N,z),"rgba(255,255,255,.55)");for(let a=.5;a<N;a+=.5)line(wq(s,a,0),wq(s,a,top),"rgba(255,255,255,.55)");
      poly(wquad(s,0,N,top,top+.12),shade(s==="L"?wl:wr,-.12))}}

  if(!mus.on||!A.ctx)return;const c=A.ctx;
  while(mus.next<c.currentTime+3){
    const t=mus.next,dur=8;pad(CHORDS[mus.idx%CHORDS.length],t,dur);
    const pool=PENTA.filter(m=>m>=69);let tt=t+.6+Math.random()*1.2;
    while(tt<t+dur-.5){if(Math.random()<.75)bell(pool[Math.floor(Math.random()*pool.length)],tt,.045+Math.random()*.03);tt+=[.5,1,1,1.5,2][Math.floor(Math.random()*5)]}
    mus.next+=dur;mus.idx++;
  }
}
function musicOn(){if(!A.ctx)return;mus.on=true;const c=A.ctx;A.mus.gain.cancelScheduledValues(c.currentTime);A.mus.gain.setTargetAtTime(SET.vol,c.currentTime,.8);
  if(mus.next<c.currentTime)mus.next=c.currentTime+.1;schedule();clearInterval(mus.timer);mus.timer=setInterval(schedule,700)}
function musicOff(){mus.on=false;clearInterval(mus.timer);if(A.ctx){A.mus.gain.cancelScheduledValues(A.ctx.currentTime);A.mus.gain.setTargetAtTime(0,A.ctx.currentTime,.4)}}
function updMusicBtn(){document.getElementById("musicB").textContent=SET.music?"🎵":"🔇"}

// ================= Vista: zoom e spostamento =================
let VW=960,VH=640,baseZ=1,cam={x:480,y:300,z:1},home={x:480,y:300},bounds=[0,0,960,640];
function Z(){return baseZ*cam.z}
function ps(e){const r=cv.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function toWorld(s){const z=Z();return{x:(s.x-VW/2)/z+cam.x,y:(s.y-VH/2)/z+cam.y}}
function pt(e){return toWorld(ps(e))}
function computeBase(){
  const x0=ox-(N+.4)*U,x1=ox+(N+.4)*U,y0=P(-.3,-.3,WH)[1]-40,y1=P(N,N,-.5)[1]+8;
  bounds=[x0,y0,x1,y1];home={x:(x0+x1)/2,y:(y0+y1)/2};baseZ=Math.min(VW/(x1-x0),VH/(y1-y0));
}
function clampCam(){
  cam.z=clamp(cam.z,1,4);if(cam.z<=1.001){cam.z=1;cam.x=home.x;cam.y=home.y;return}
  const z=Z(),hw=VW/2/z,hh=VH/2/z,[x0,y0,x1,y1]=bounds;
  cam.x=(x1-x0)>2*hw?clamp(cam.x,x0+hw,x1-hw):home.x;cam.y=(y1-y0)>2*hh?clamp(cam.y,y0+hh,y1-hh):home.y;
}
function zoomAt(s,nz){const w=toWorld(s);cam.z=clamp(nz,1,4);const z=Z();cam.x=w.x-(s.x-VW/2)/z;cam.y=w.y-(s.y-VH/2)/z;clampCam();dirty=true}

// ---------- input ----------
function inRect(p,r){return r&&p.x>=r[0]&&p.x<=r[0]+r[2]&&p.y>=r[1]&&p.y<=r[1]+r[3]}
function pickItem(p){for(let k=lastOrder.length-1;k>=0;k--){const o=lastOrder[k];if(o.kind==="item"&&inRect(p,o.it.rect))return o.it}return null}
function pickCarton(p){for(let k=lastOrder.length-1;k>=0;k--){const o=lastOrder[k];if(o.kind==="carton"&&o.bb&&p.x>=o.bb[0]&&p.x<=o.bb[2]&&p.y>=o.bb[1]&&p.y<=o.bb[3])return o}return null}
function slotCenter(s){const p=P(s.x,s.y,s.z);return s.plane==="top"?[p[0],p[1]-s.s/2]:p}
function findTarget(it,bx,by){
  let best=null,bd=50;const cx=bx,cy=by-it.s*.55;
  for(const s of R.slots){if(s.item&&s.item!==it)continue;const c=slotCenter(s);const d=Math.hypot(c[0]-cx,c[1]-cy);if(d<bd){bd=d;best=s}}
  return best;
}
const ptrs=new Map();let pinch=null,pan=null,lastTap={t:0,x:0,y:0};
cv.addEventListener("pointerdown",e=>{
  e.preventDefault();const s=ps(e);ptrs.set(e.pointerId,s);
  if(ptrs.size===2&&!drag){pan=null;const[a,b]=[...ptrs.values()];const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,z:cam.z,w:toWorld(mid)};return}
  if(ptrs.size>1)return;
  const p=toWorld(s);
  if(!finished){
    const it=pickItem(p);
    if(it){timerOn=true;cv.setPointerCapture(e.pointerId);
      const r=it.rect,bx=r[0]+r[2]/2,by=it.plane==="top"?r[1]+r[3]-it.s*.04:r[1]+r[3]*.5+it.s*.5;
      drag={it,dx:bx-p.x,dy:by-p.y,bx,by,prev:{state:it.state,slot:it.slot,x:it.x,y:it.y,z:it.z,plane:it.plane},target:null};
      if(it.slot){it.slot.item=null;it.slot=null}it.state="drag";it.anim=null;it.bad=false;SFX.pick();dirty=true;return}
    const c=pickCarton(p);if(c){timerOn=true;if(hint&&hint.carton===c)hint=null;openCarton(c);return}
  }
  if(now-lastTap.t<320&&Math.hypot(s.x-lastTap.x,s.y-lastTap.y)<30){zoomAt(s,cam.z>1.3?1:2.2);lastTap.t=0;return}
  lastTap={t:now,x:s.x,y:s.y};
  cv.setPointerCapture(e.pointerId);pan={sx:s.x,sy:s.y,cx:cam.x,cy:cam.y};
});
cv.addEventListener("pointermove",e=>{
  const s=ps(e);if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,s);
  if(pinch&&ptrs.size>=2){const[a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y),mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
    cam.z=clamp(pinch.z*d/pinch.d,1,4);const z=Z();cam.x=pinch.w.x-(mid.x-VW/2)/z;cam.y=pinch.w.y-(mid.y-VH/2)/z;clampCam();dirty=true;return}
  const p=toWorld(s);
  if(drag){drag.bx=p.x+drag.dx;drag.by=p.y+drag.dy;drag.target=findTarget(drag.it,drag.bx,drag.by);dirty=true;return}
  if(pan){const z=Z();cam.x=pan.cx-(s.x-pan.sx)/z;cam.y=pan.cy-(s.y-pan.sy)/z;clampCam();dirty=true;return}
  if(e.pointerType==="mouse"){const h=pickItem(p);const c=h?null:pickCarton(p);if(h!==hover){hover=h;dirty=true}cv.style.cursor=h?"grab":c?"pointer":(cam.z>1?"move":"default")}
});
function ptrUp(e){
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;pan=null;return}
  if(drag)endDrag();pan=null;
}
cv.addEventListener("pointerup",ptrUp);cv.addEventListener("pointercancel",ptrUp);
cv.addEventListener("pointerleave",()=>{if(hover){hover=null;dirty=true}});
cv.addEventListener("wheel",e=>{e.preventDefault();zoomAt(ps(e),cam.z*Math.exp(-e.deltaY*.0015))},{passive:false});
document.getElementById("zIn").onclick=()=>zoomAt({x:VW/2,y:VH/2},cam.z*1.4);
document.getElementById("zOut").onclick=()=>zoomAt({x:VW/2,y:VH/2},cam.z/1.4);
document.getElementById("zFit").onclick=()=>{cam.z=1;clampCam();dirty=true};

function endDrag(){
  if(!drag)return;const it=drag.it,t=drag.target;
  if(t&&RULE.errs&&t.tag!==it.tag){
    errors++;it.flash=now;SFX.wrong();
    const[sx,sy]=freeSpot(clamp(t.x,.6,N-.6)+.7,clamp(t.y,.6,N-.6)+.7,it);
    Object.assign(it,{state:"loose",slot:null,x:sx,y:sy,z:0,plane:"top",bad:false});
    it.anim={t0:now,dur:380,fx:t.plane==="L"?.3:t.x,fy:t.plane==="R"?.3:t.y,fz:t.z};
    showToast(`Non va lì! Errori: ${errors}/${RULE.errs}`);
    drag=null;dirty=true;updateStatus();updateCount();
    if(errors>=RULE.errs)setTimeout(()=>lose("errs"),450);
    return;
  }
  if(t){it.state="slot";it.slot=t;t.item=it;it.x=t.x;it.y=t.y;it.z=t.z;it.plane=t.plane;it.popT=now;SFX.place()}
  else{const[fx,fy]=inv(drag.bx,drag.by);
    if(fx>-.2&&fy>-.2&&fx<N+.2&&fy<N+.2){const[sx,sy]=freeSpot(fx,fy,it);it.state="loose";it.x=sx;it.y=sy;it.z=0;it.plane="top";SFX.drop()}
    else{const pv=drag.prev;Object.assign(it,{state:pv.state,x:pv.x,y:pv.y,z:pv.z,plane:pv.plane});if(pv.slot&&!pv.slot.item){it.slot=pv.slot;pv.slot.item=it}else if(pv.slot){const[sx,sy]=freeSpot(N/2,N/2,it);Object.assign(it,{state:"loose",slot:null,x:sx,y:sy,z:0,plane:"top"})}}}
  if(hint&&hint.it===it)hint=null;
  drag=null;dirty=true;check();
}

// ---------- interfaccia ----------
let toastT;
function showToast(t){const el=document.getElementById("toast");el.textContent=t;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2400)}
function overlay(html,buttons){
  const o=document.createElement("div");o.className="overlay";const c=document.createElement("div");c.className="card";c.innerHTML=html;o.appendChild(c);
  for(const[label,cls,fn]of buttons){const b=document.createElement("button");b.className=cls;b.textContent=label;b.style.margin="4px";b.onclick=()=>{o.remove();SFX.ui();fn()};c.appendChild(b)}
  holder.appendChild(o);return o;
}
function fmtTime(s){s=Math.ceil(s);return`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`}
function updateStatus(){
  const te=document.getElementById("timer"),ee=document.getElementById("errs");
  te.style.display=RULE.time?"inline-block":"none";ee.style.display=RULE.errs?"inline-block":"none";
  if(RULE.time){te.textContent="⏱ "+fmtTime(timeLeft);te.classList.toggle("low",timeLeft<=20&&!finished)}
  if(RULE.errs)ee.textContent=`❌ ${errors}/${RULE.errs}`;
}
function lose(kind){
  if(finished)return;finished=true;drag=null;hint=null;SFX.lose();updateStatus();
  overlay(`<div class="big">${kind==="time"?"⏰":"💥"}</div><h2>${kind==="time"?"Tempo scaduto":"Troppi errori"}</h2><p>${kind==="time"?"La stanza non è finita in tempo.":"Hai raggiunto il numero massimo di errori."} Riprova!</p>`,
    [["Riprova la stanza","primary",()=>loadRoom(ri,false)],["Impostazioni","",()=>settingsMenu(()=>loadRoom(ri,false))]]);
}
function win(){
  SFX.win();
  if(ri<ROOMS.length-1){
    const extra=RULE.time?`<p class="how">Tempo rimasto: ${fmtTime(timeLeft)}${RULE.errs?` · Errori: ${errors}/${RULE.errs}`:""}</p>`:RULE.errs?`<p class="how">Errori: ${errors}/${RULE.errs}</p>`:"";
    overlay(`<div class="big">✨</div><h2>${room.name}: tutto a posto!</h2><p>Ogni oggetto ha trovato il suo posto.</p>${extra}`,[["Prossima stanza","primary",()=>loadRoom(ri+1)]]);
  }else{
    overlay(`<div class="big">🧸</div><h2>Fine</h2><p>Cinque case, undici stanze, tanti scatoloni.<br>Il vecchio orsetto adesso ha un nuovo padrone.</p>`,[["Rigioca dall'inizio","primary",()=>loadRoom(0)]]);
  }
}
function roomsMenu(){
  const mx=parseInt(store("scatoloni3-max")||"0",10)||0;
  const o=overlay(`<h2>Stanze</h2><div class="rooms"></div>`,[["Chiudi","",()=>{}]]);
  const box=o.querySelector(".rooms");let h=-1;
  ROOMS.forEach((r,i)=>{if(r.h!==h){h=r.h;const d=document.createElement("div");d.className="h";d.textContent=`${HOUSES[h].year} · ${HOUSES[h].name}`;box.appendChild(d)}
    const b=document.createElement("button");b.textContent=(i<=mx?"":"🔒 ")+r.name+(i===ri?"  ← qui":"");b.disabled=i>mx;b.onclick=()=>{o.remove();loadRoom(i)};box.appendChild(b)});
}
function settingsMenu(after){
  const seg=(k,opts)=>`<div class="seg" data-k="${k}">${opts.map(([v,l])=>`<button data-v="${v}">${l}</button>`).join("")}</div>`;
  const o=overlay(`<h2>Impostazioni</h2><div class="set">
    <div class="row"><div class="lab">🎵 Musica di sottofondo</div>${seg("music",[[1,"Accesa"],[0,"Spenta"]])}
      <label class="note">Volume musica <input type="range" min="0" max="1" step="0.05" id="volR"></label></div>
    <div class="row"><div class="lab">🔔 Effetti sonori</div>${seg("sfx",[[1,"Accesi"],[0,"Spenti"]])}</div>
    <div class="row"><div class="lab">⏱ Tempo per ogni stanza</div>${seg("time",[[0,"Nessun limite"],[1,"1 min"],[2,"2 min"],[3,"3 min"],[5,"5 min"],[10,"10 min"]])}</div>
    <div class="row"><div class="lab">❌ Errori massimi per stanza</div>${seg("errs",[[0,"Nessun limite"],[1,"1"],[3,"3"],[5,"5"],[10,"10"]])}
      <div class="note">Con un limite di errori, un oggetto messo nel posto sbagliato viene respinto subito e conta come errore.</div></div>
    <div class="note">Tempo ed errori valgono dalla prossima stanza, oppure subito se ricominci la stanza con ↺.</div>
  </div>`,[["Fatto","primary",()=>{after&&after()}]]);
  const refresh=()=>o.querySelectorAll(".seg").forEach(sg=>{const k=sg.dataset.k;sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(+SET[k])===b.dataset.v))});
  o.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.parentNode.dataset.k;SET[k]=(k==="music"||k==="sfx")?b.dataset.v==="1":+b.dataset.v;saveSet();refresh();
    if(k==="music"){initAudio();SET.music?musicOn():musicOff();updMusicBtn()}
    if(k==="sfx"&&A.ctx)A.sfx.gain.value=SET.sfx?.8:0;
    SFX.ui();
  });
  const vr=o.querySelector("#volR");vr.value=SET.vol;vr.oninput=()=>{SET.vol=+vr.value;saveSet();if(A.ctx&&mus.on)A.mus.gain.setTargetAtTime(SET.vol,A.ctx.currentTime,.1)};
  refresh();
}
function doHint(){
  if(finished)return;
  let it=items.find(i=>i.bad)||items.find(i=>i.state==="loose")||items.find(i=>i.state==="slot"&&i.slot.tag!==i.tag);
  if(!it){const c=cartons.find(c=>c.queue.length&&!c.vanish);if(c){hint={carton:c,t0:now};showToast("Apri uno scatolone")}else showToast("Sembra tutto a posto!");dirty=true;return}
  const slot=R.slots.find(s=>s.tag===it.tag&&!s.item)||R.slots.find(s=>s.tag===it.tag&&s.item&&s.item.tag!==s.tag);
  hint={it,slot,t0:now};showToast(`${it.n}: il posto giusto lampeggia`);dirty=true;
}
document.getElementById("hintB").onclick=doHint;
document.getElementById("roomsB").onclick=roomsMenu;
document.getElementById("setB").onclick=()=>settingsMenu();
document.getElementById("restartB").onclick=()=>loadRoom(ri,false);
document.getElementById("musicB").onclick=()=>{SET.music=!SET.music;saveSet();initAudio();SET.music?musicOn():musicOff();updMusicBtn()};
updMusicBtn();

function fit(){
  VW=Math.max(100,wrap.clientWidth);VH=Math.max(100,wrap.clientHeight);
  cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);
  if(room){const z=cam.z,x=cam.x,y=cam.y;computeBase();cam.z=z;cam.x=x;cam.y=y;clampCam()}
  dirty=true;
}
addEventListener("resize",fit);
fit();
const saved=parseInt(store("scatoloni3-cur")||"0",10)||0;
loadRoom(0,false);
const start=overlay(`<div class="big">📦</div><h2>Scatoloni</h2><p>Un gioco tranquillo sul disfare traslochi.<br>Tira fuori gli oggetti, mettili al loro posto e scopri una vita, stanza dopo stanza.</p><p class="how">Due dita per ingrandire, doppio tocco per zoomare. ⚙️ per musica, tempo ed errori.</p>`,
  [["Nuova partita","primary",()=>loadRoom(0)]].concat(saved>0?[[`Continua: ${ROOMS[saved].name}`,"",()=>loadRoom(saved)]]:[]));
requestAnimationFrame(frame);
addEventListener("orientationchange",()=>setTimeout(fit,300));
document.addEventListener("gesturestart",e=>e.preventDefault());
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
