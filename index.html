<html lang="it">

<meta name="mobile-web-app-capable" content="yes">

<title>Scatoloni</title>
<style>
:root{--ink:#3b2a26;--paper:#fff8ef;--accent:#ef7d6b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2233;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;
  overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%}
#wrap{position:absolute;inset:0}
#holder{position:absolute;inset:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff8ef;color:var(--ink);font-weight:800}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#fff;padding:11px 26px;font-size:17px;box-shadow:0 3px 0 var(--ink)}
/* HUD sopra il gioco */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;z-index:4;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}
#hud>*{pointer-events:auto}
#hud .sp{flex:1;pointer-events:none}
.pill{background:rgba(42,30,48,.72);color:#fff8ef;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.15)}
#timer,#errs,#puz{display:none}
#timer.low{background:#c8414a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
#hud button{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center}
#zoomUI{position:absolute;right:max(10px,env(safe-area-inset-right));bottom:max(10px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:7px;z-index:3}
#zoomUI button{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 0 var(--ink)}
#toast{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 50px));transform:translateX(-50%);background:var(--paper);padding:8px 16px;border-radius:14px;font-weight:800;
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:opacity .4s;opacity:0;pointer-events:none;white-space:nowrap;font-size:15px;z-index:4}
.overlay{position:absolute;inset:0;background:rgba(42,30,48,.6);display:flex;align-items:center;justify-content:center;z-index:6}
.card{background:var(--paper);border-radius:22px;border:3px solid var(--ink);padding:24px 30px;max-width:min(560px,92%);max-height:90%;overflow:auto;text-align:center;box-shadow:0 6px 0 var(--ink)}
.card .year{font-size:42px;font-weight:900;color:var(--accent);line-height:1;-webkit-text-stroke:1px var(--ink)}
.card h2{margin:6px 0 10px;font-size:26px}
.card p{font-size:17px;line-height:1.5;margin:0 0 14px}
.card .how{font-size:14px;opacity:.75}
.card .big{font-size:54px;margin-bottom:4px}
.rooms{display:grid;gap:6px;text-align:left;margin:10px 0 16px}
.rooms .h{font-weight:900;margin-top:8px;font-size:14px;color:var(--accent)}
.rooms button{background:#f6e9da;text-align:left;font-weight:700;box-shadow:none}
.rooms button[disabled]{opacity:.4;cursor:default}
.set{text-align:left;display:grid;gap:14px;margin:6px 0 16px}
.set .row{display:grid;gap:6px}
.set .lab{font-weight:900;font-size:15px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#f6e9da;font-weight:700;padding:6px 11px}
.seg button.on{background:var(--accent);color:#fff}
.set input[type=range]{width:100%;accent-color:var(--accent)}
.set .note{font-size:13px;opacity:.75}
#rotate{display:none;position:fixed;inset:0;background:#2a2233;color:#fff8ef;z-index:50;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;font-size:18px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
@media (orientation:portrait) and (max-width:700px){#rotate.on{display:flex}}
@media (max-width:560px),(max-height:420px){#hud button{width:36px;height:36px;font-size:16px}.pill{font-size:13px;padding:5px 10px}}
.pzb{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:6px 0 14px}
.pzb .w100{width:100%}
.dig{display:flex;flex-direction:column;align-items:center;gap:5px}
.dig span{font-size:34px;font-weight:900;width:54px;height:58px;line-height:58px;background:#2b2d42;color:#ffd60a;border-radius:12px;border:3px solid var(--ink);font-variant-numeric:tabular-nums}
.sm{padding:3px 14px;font-size:16px}
.bulb{width:52px;height:60px;border-radius:50% 50% 45% 45%;border:3px solid var(--ink);box-shadow:inset -7px -7px 0 rgba(0,0,0,.15);font-size:20px;color:#888}
.tiles{display:grid;grid-template-columns:repeat(3,54px);gap:6px}
.tile{width:54px;height:54px;border-radius:8px;border:3px solid var(--ink);background:#e9e4dc;padding:0}
.tile.on{background:#4cc9f0}
.keys{gap:4px}
.key{width:48px;height:96px;border-radius:0 0 12px 12px;background:#fff;font-weight:900;padding:0;align-items:flex-end;display:flex;justify-content:center;padding-bottom:8px}
.seq{font-size:22px;font-weight:900;letter-spacing:2px;min-height:30px}
.opt{font-size:18px;padding:10px 14px}
.lbl2{width:70px;text-align:right;font-weight:800;align-self:center}
.row2{display:flex;gap:8px;justify-content:center;width:100%}
.shake{animation:shake2 .4s}
@keyframes shake2{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.overlay.side{background:transparent;justify-content:flex-start;align-items:flex-start;pointer-events:none}
.overlay.side .card{pointer-events:auto;margin:max(58px,calc(env(safe-area-inset-top) + 52px)) 0 10px max(10px,env(safe-area-inset-left));max-width:min(330px,90%);max-height:calc(100% - 70px);text-align:left;padding:14px 16px}
.overlay.side .card h2{font-size:20px;margin:0 0 6px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:30px;height:30px;border-radius:50%;padding:0;box-shadow:none;font-size:13px}
.sw.on{outline:3px solid var(--accent);outline-offset:2px}

</style>
</head>

  for(const it of items)if(it!==ignore&&it.state==="loose"&&Math.hypot(it.x-x,it.y-y)<.62)return false;

function bboxOf(o){

  for(let k=0;k<n;k++){let best=-1,bk=1e9;
    for(let i=0;i<n;i++)if(!done[i]&&indeg[i]===0&&key(list[i])<bk){bk=key(list[i]);best=i}

    <div class="note">Tempo ed errori valgono dalla prossima stanza, oppure subito se ricominci la stanza con ↺.</div>
  </div>`,[["Fatto","primary",()=>{after&&after()}]]);
  const refresh=()=>o.querySelectorAll(".seg").forEach(sg=>{const k=sg.dataset.k;sg.querySelectorAll("button").forEach(b=>b.classList.toggle("on",String(+SET[k])===b.dataset.v))});
  o.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{
    const k=b.parentNode.dataset.k;SET[k]=(k==="music"||k==="sfx")?b.dataset.v==="1":+b.dataset.v;saveSet();refresh();
    if(k==="music"){initAudio();SET.music?musicOn():musicOff();updMusicBtn()}
    if(k==="sfx"&&A.ctx)A.sfx.gain.value=SET.sfx?.8:0;
    SFX.ui();
  });
  const vr=o.querySelector("#volR");vr.value=SET.vol;vr.oninput=()=>{SET.vol=+vr.value;saveSet();if(A.ctx&&mus.on)A.mus.gain.setTargetAtTime(SET.vol,A.ctx.currentTime,.1)};
  refresh();
}
function tapItem(it){
  const pz=(R.puzzles||[]).find(p=>p.item===it.key&&!p.solved);
  if(pz){if(it.state==="slot")openPuzzle(pz);else showToast(pz.needPlace);return}
  const cl=R.clues&&R.clues[it.key];
  if(cl){SFX.ui();overlay(`<div class="big">🔍</div><h2>${it.n}</h2><p>${cl}</p>`,[["Ok","primary",()=>{}]]);return}
  SFX.tick();showToast(it.n);
}
function doHint(){
  if(finished)return;
  const pzl=(R.puzzles||[]).find(p=>!p.solved);
  if(pzl&&items.every(i=>i.state==="slot"&&allowed(i,i.slot))){showToast("🧩 "+pzl.hint);return}
  const it=items.find(i=>i.bad)||items.find(i=>i.state==="loose")||items.find(i=>i.state==="slot"&&!allowed(i,i.slot));
  if(!it){const c=cartons.find(c=>c.queue.length&&!c.vanish);if(c){hint={carton:c,t0:now};showToast("Apri uno scatolone")}else showToast("Sembra tutto a posto!");dirty=true;return}
  const free=R.slots.filter(s=>!s.item&&allowed(it,s));
  const open=free.find(s=>slotOn(s));
  if(open){hint={it,slot:open,t0:now};showToast(`${it.n}: ecco un posto adatto`)}
  else if(free.length){const op=free[0].owner;hint={it,op,t0:now};showToast(`${it.n}: prova ad aprire ${op.label}`)}
  else{const occ=R.slots.find(s=>s.item&&allowed(it,s));hint={it,slot:null,t0:now};showToast(occ?`${it.n}: libera prima un posto occupato`:"Prova a spostare qualcosa")}
  dirty=true;
}
document.getElementById("hintB").onclick=doHint;
document.getElementById("roomsB").onclick=roomsMenu;
document.getElementById("lookB").onclick=()=>lookMenu();
document.getElementById("setB").onclick=()=>settingsMenu();
document.getElementById("restartB").onclick=()=>loadRoom(ri,false);
document.getElementById("musicB").onclick=()=>{SET.music=!SET.music;saveSet();initAudio();SET.music?musicOn():musicOff();updMusicBtn()};
updMusicBtn();

// ---------- schermo intero ----------
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: fullscreen)").matches||navigator.standalone===true;
const fsEl=()=>document.fullscreenElement||document.webkitFullscreenElement;
const fsB=document.getElementById("fsB");
if(isStandalone())fsB.style.display="none";
fsB.onclick=()=>{
  const de=document.documentElement,req=de.requestFullscreen||de.webkitRequestFullscreen;
  if(fsEl()){(document.exitFullscreen||document.webkitExitFullscreen).call(document);return}
  if(req&&(document.fullscreenEnabled||document.webkitFullscreenEnabled)){
    try{const p=req.call(de,{navigationUI:"hide"});if(p&&p.then)p.then(()=>{try{screen.orientation.lock("landscape").catch(()=>{})}catch(e){}}).catch(()=>iosFsHelp())}catch(e){iosFsHelp()}
  }else iosFsHelp();
};
function iosFsHelp(){
  overlay(`<div class="big">📲</div><h2>Gioca a tutto schermo</h2><p>Su iPhone Safari non permette il tutto schermo dentro il browser.<br>Per vedere solo il gioco:</p>
    <p style="text-align:left">1. Tocca <b>Condividi</b> (il quadrato con la freccia)<br>2. Scegli <b>Aggiungi alla schermata Home</b><br>3. Lascia attivo <b>Apri come app web</b> e tocca <b>Aggiungi</b><br>4. Apri Scatoloni <b>dall'icona</b> sulla Home</p>
    <p class="how">Se l'avevi già aggiunto e vedi ancora la barra, cancella l'icona e aggiungila di nuovo.</p>`,[["Ho capito","primary",()=>{}]]);
}
document.addEventListener("fullscreenchange",()=>setTimeout(fit,120));document.addEventListener("webkitfullscreenchange",()=>setTimeout(fit,120));

function fit(){
  VW=Math.max(100,wrap.clientWidth);VH=Math.max(100,wrap.clientHeight);
  cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);
  if(room){const z=cam.z,x=cam.x,y=cam.y;computeBase();cam.z=z;cam.x=x;cam.y=y;clampCam()}
  dirty=true;
}
addEventListener("resize",fit);
addEventListener("orientationchange",()=>setTimeout(fit,300));
document.addEventListener("gesturestart",e=>e.preventDefault());
fit();
const saved=parseInt(store("scatoloni3-cur")||"0",10)||0;
loadRoom(0,false);
document.getElementById("toast").style.opacity=0;
overlay(`<div class="big">📦</div><h2>Scatoloni</h2><p>Un gioco tranquillo sul disfare traslochi.<br>Apri gli scatoloni, sistema le cose come piace a te e scopri una vita, stanza dopo stanza.</p><p class="how">Due dita per ingrandire · doppio tocco per zoomare · tocca frigo, armadi, cassetti e coperte per aprirli</p>`,
  [["Nuova partita","primary",()=>loadRoom(0)]].concat(saved>0?[[`Continua: ${ROOMS[saved].name}`,"",()=>loadRoom(saved)]]:[]));
requestAnimationFrame(frame);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
