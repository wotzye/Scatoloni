<style>
:root{--ink:#4a2c5e;--paper:#fffaf5;--accent:#ff6f91;--accent2:#ff9671}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#2a2233;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Hiragino Maru Gothic ProN",Nunito,system-ui,sans-serif;color:var(--ink);overflow:hidden;

html,body{position:fixed;inset:0;width:100%}
#wrap{position:absolute;inset:0}
#holder{position:absolute;inset:0;overflow:hidden}
#cv{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;cursor:pointer;border:2px solid var(--ink);border-radius:12px;padding:6px 12px;background:#fff8ef;color:var(--ink);font-weight:800}
button:active{transform:translateY(1px)}
button.primary{background:var(--accent);color:#fff;padding:11px 26px;font-size:17px;box-shadow:0 3px 0 var(--ink)}
/* HUD sopra il gioco */
#hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:6px;z-index:4;pointer-events:none;
  padding:max(8px,env(safe-area-inset-top)) max(10px,env(safe-area-inset-right)) 0 max(10px,env(safe-area-inset-left))}

.pill{background:rgba(42,30,48,.72);color:#fff8ef;border-radius:999px;padding:6px 12px;font-weight:800;font-size:14px;white-space:nowrap;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:2px solid rgba(255,255,255,.15)}
#timer,#errs,#puz,#cmb{display:none}
#timer.low{background:#c8414a;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.55}}
#hud button{width:40px;height:40px;border-radius:50%;padding:0;font-size:18px;box-shadow:0 2px 0 var(--ink);display:flex;align-items:center;justify-content:center}

#zoomUI button{width:42px;height:42px;border-radius:50%;padding:0;font-size:20px;box-shadow:0 2px 0 var(--ink)}
#toast{position:absolute;left:50%;top:max(58px,calc(env(safe-area-inset-top) + 50px));transform:translateX(-50%);background:var(--paper);padding:8px 16px;border-radius:14px;font-weight:800;
  border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink);transition:opacity .4s;opacity:0;pointer-events:none;white-space:nowrap;font-size:15px;z-index:4}
.overlay{position:absolute;inset:0;background:rgba(42,30,48,.6);display:flex;align-items:center;justify-content:center;z-index:6}

.card .year{font-size:42px;font-weight:900;color:var(--accent);line-height:1;-webkit-text-stroke:1px var(--ink)}
.card h2{margin:6px 0 10px;font-size:26px}
.card p{font-size:17px;line-height:1.5;margin:0 0 14px}
.card .how{font-size:14px;opacity:.75}
.card .big{font-size:54px;margin-bottom:4px}
.rooms{display:grid;gap:6px;text-align:left;margin:10px 0 16px}
.rooms .h{font-weight:900;margin-top:8px;font-size:14px;color:var(--accent)}

.rooms button{background:#f6e9da;text-align:left;font-weight:700;box-shadow:none}

.set{text-align:left;display:grid;gap:14px;margin:6px 0 16px}

.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{background:#f6e9da;font-weight:700;padding:6px 11px}
.seg button.on{background:var(--accent);color:#fff}
.set input[type=range]{width:100%;accent-color:var(--accent)}
.set .note{font-size:13px;opacity:.75}
#rotate{display:none;position:fixed;inset:0;background:#2a2233;color:#fff8ef;z-index:50;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:30px;font-size:18px}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}

.pzb{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:6px 0 14px}

.dig{display:flex;flex-direction:column;align-items:center;gap:5px}

.sm{padding:3px 14px;font-size:16px}

.opt{font-size:18px;padding:10px 14px}

function check(){
  updateCount();
  if(finished)return;
  if(items.some(i=>i.state!=="slot"||i.part)){
    if(items.some(i=>i.part)&&items.every(i=>i.part||i.state==="slot")&&!R.partNag){R.partNag=1;showToast("Ci sono ancora pezzi da ricomporre 🔧")}
    return}
  const wrong=items.filter(i=>!allowed(i,i.slot));
  items.forEach(i=>i.bad=wrong.includes(i));
  const left=R.creative?[]:(R.puzzles||[]).filter(p=>!p.solved);
  if(!wrong.length&&left.length){if(!R.puzzleNag){R.puzzleNag=1;showToast("Tutto in ordine! Manca ancora un enigma 🧩")}dirty=true;return}
  if(!wrong.length){finished=true;const c=P(N/2,N/2,1);for(let k=0;k<4;k++)setTimeout(()=>sparkle(c[0]+(Math.random()-.5)*300,c[1]-Math.random()*200,8),k*150);setTimeout(win,900)}

  dirty=true;
}

    return (R.pieces||[]).some(pc=>{if(pc.gone)return false;const k=pieceKinds(pc);return its.every(i=>i.ok.some(o=>k.has(o)))})}
  const rk=roomKinds(),pcs=(R.pieces||[]).filter(pc=>!pc.gone&&th.k.some(k=>pieceKinds(pc).has(k)));

function harmony(){
  const fin=items.filter(i=>!i.part),res=[];
  for(const th of THEMES){
    if((th.w||"casa")!==(R.world||"casa"))continue;
    const its=fin.filter(i=>(th.near||th.by).includes(i.key));
    if(th.near?its.length<2:!its.length)continue;
    if(th.by&&!th.k.some(k=>k==="window"?R.wall.some(w=>w.t==="window"):kindExists(k)))continue;
    if(!themeFeasible(th,its))continue;
    let ok=its.every(i=>i.state==="slot");
    if(ok&&th.near){const p0=itemPiece(its[0]);const same=p0&&its.every(i=>itemPiece(i)===p0);
      const cx=its.reduce((a,i)=>a+i.x,0)/its.length,cy=its.reduce((a,i)=>a+i.y,0)/its.length;
      ok=same||its.every(i=>Math.hypot(i.x-cx,i.y-cy)<=1.7)}
    else if(ok)ok=its.every(i=>{const s=i.slot;if(th.k.includes(s.kind)||(th.k.includes("window")&&s.kind==="sill"))return true;
      const pc=itemPiece(i);if(pc&&th.k.some(k=>pieceKinds(pc).has(k)))return true;return th.k.some(k=>distToKind(i.x,i.y,k)<=th.d)});
    res.push({t:th.t,ok})}

}

function bTouch(a,b,t=.03){return a.x<b.x+b.w+t&&b.x<a.x+a.w+t&&a.y<b.y+b.d+t&&b.y<a.y+a.d+t&&a.z<b.z+b.h+t&&b.z<a.z+a.h+t}
function computePieces(){
  const bs=R.boxes.filter(b=>!b.win),par=bs.map((_,i)=>i),f=i=>par[i]===i?i:(par[i]=f(par[i]));

  const map=new Map();bs.forEach((b,i)=>{const r=f(i);if(!map.has(r))map.set(r,{boxes:[],opens:[]});map.get(r).boxes.push(b)});

  for(const op of R.opens){const b=op.type==="door"?op.boxes[0]:op.type==="drawer"?op.body:op.box;if(b&&b.pc){b.pc.opens.push(op);op.pc=b.pc}}

function pieceItems(pc){return items.filter(it=>it.slot&&((it.slot.surf&&it.slot.surf.box&&it.slot.surf.box.pc===pc)||(it.slot.owner&&it.slot.owner.pc===pc)))}

const swapDeco=d=>d.t==="fy"?{...d,t:"fx",v0:d.u0,v1:d.u1}:d.t==="fx"?{...d,t:"fy",u0:d.v0,u1:d.v1}:d.t==="rect"?{...d,u0:d.v0,v0:d.u0,u1:d.v1,v1:d.u1}:d.t==="ell"?{...d,u:d.v,v:d.u}:d;

function tidyAfterArrange(){

    if(!hit())continue;const ox0=c.x,oy0=c.y;let done=false;

function addPiece(type){const C=catalogFor()[type];if(!C)return null;const nb=R.boxes.length,no=R.opens.length,ns=R.surfs.length;
  C.b(R,N/2-.5,N/2-.5);const boxes=R.boxes.slice(nb),pc={boxes,opens:R.opens.slice(no),id:R.pieces.length,added:type};
  boxes.forEach(b=>{b.pc=pc;b.c0=b.c});pc.opens.forEach(o=>{o.pc=pc;updOpen(o)});pieceInfo(pc);R.pieces.push(pc);return pc}

  for(const k in R.tags){const t=R.tags[k];if(pc.boxes.includes(t)||pc.opens.includes(t))return"Serve per un enigma: non si può togliere"}

  R.boxes=R.boxes.filter(b=>b.pc!==pc);R.surfs=R.surfs.filter(sf=>sf.box.pc!==pc);R.slots=R.slots.filter(s=>!(s.owner&&s.owner.pc===pc));R.opens=R.opens.filter(o=>o.pc!==pc);pc.gone=true}

function autoPlace(pc){

    cand.push([i*st,j*st,Math.hypot(i,j)*st+(pc.L&&i?2.5:0)+(pc.Rw&&j?2.5:0)])}

    const F=b.faces||(b.faces={xp:b.decos.filter(d=>d.t==="fx"),yp:b.decos.filter(d=>d.t==="fy"),xm:[],ym:[]});
    const top=b.decos.filter(d=>d.t!=="fx"&&d.t!=="fy").map(turnDeco);
    b.faces={xp:F.ym.map(d=>({...d,t:"fx",v0:d.u0,v1:d.u1})),yp:F.xp.map(turnDeco),xm:F.yp.map(d=>({...d})),ym:F.xm.map(d=>({...d,u0:1-d.u1,u1:1-d.u0}))};

function wallTo(prims,side){

  }else iosFsHelp();
};
function iosFsHelp(){
  overlay(`<div class="big">📲</div><h2>Gioca a tutto schermo</h2><p>Su iPhone Safari non permette il tutto schermo dentro il browser.<br>Per vedere solo il gioco:</p>
    <p style="text-align:left">1. Tocca <b>Condividi</b> (il quadrato con la freccia)<br>2. Scegli <b>Aggiungi alla schermata Home</b><br>3. Lascia attivo <b>Apri come app web</b> e tocca <b>Aggiungi</b><br>4. Apri Scatoloni <b>dall'icona</b> sulla Home</p>
    <p class="how">Se l'avevi già aggiunto e vedi ancora la barra, cancella l'icona e aggiungila di nuovo.</p>`,[["Ho capito","primary",()=>{}]]);
}
document.addEventListener("fullscreenchange",()=>setTimeout(fit,120));document.addEventListener("webkitfullscreenchange",()=>setTimeout(fit,120));

function fit(){
  VW=Math.max(100,wrap.clientWidth);VH=Math.max(100,wrap.clientHeight);
  cv.width=Math.round(VW*dpr);cv.height=Math.round(VH*dpr);
  if(room){const z=cam.z,x=cam.x,y=cam.y;computeBase();cam.z=z;cam.x=x;cam.y=y;clampCam()}
  dirty=true;
}
addEventListener("resize",fit);
addEventListener("orientationchange",()=>setTimeout(fit,300));
document.addEventListener("gesturestart",e=>e.preventDefault());
fit();
const saved=parseInt(store("scatoloni3-cur")||"0",10)||0;
loadRoom(0,false);
document.getElementById("toast").style.opacity=0;
overlay(`<div class="big">📦</div><h2>Scatoloni</h2><p>Apri gli scatoloni e sistema le cose come piace a te.<br>Quattro mondi: 🏠 Casa · 🏥 Ospedale · 👻 Villa horror · 🚀 Astronave</p><p class="how">Trascina gli oggetti dove vuoi · doppio tocco su un oggetto per girarlo · tocca frigo, armadi, cassetti e coperte per aprirli · due dita per ingrandire</p>`,
  [["Scegli un mondo","primary",()=>{MODE="story";store("scatoloni-mode",MODE);worldMenu()}]].concat(saved>0&&ROOMS[saved]?[[`Continua: ${ROOMS[saved].name}`,"",()=>{MODE="story";store("scatoloni-mode",MODE);loadRoom(saved)}]]:[])
   .concat([["🎨 Modalità creativa","",()=>{MODE="creative";store("scatoloni-mode",MODE);worldMenu()}]]));
requestAnimationFrame(frame);
if("serviceWorker" in navigator&&location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js").catch(()=>{});
